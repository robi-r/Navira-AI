[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navira-ai"
version = "0.1.0"
description = "Landed-cost estimates, import checklists and quotes for shipments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
